# Every check runs here, in pre-push; there is no CI and no pre-commit hook.
# merge.ts reruns pre-push on the head merged onto the live main before it
# merges.

# A hook that finds no lefthook binary fails the push instead of printing
# "Can't find lefthook in PATH" and passing with no check run.
assert_lefthook_installed: true

# Each job checks HEAD's committed tree, exported with `git archive` into a
# temporary directory, so an uncommitted or untracked file in the working tree
# cannot decide the result. HEAD is what `git push origin HEAD[:<ref>]` sends
# and what merge.ts checks out; a push of another ref still checks HEAD. The
# jobs read no refs from stdin: lefthook hands every use_stdin job one shared
# reader, so parallel jobs would split the lines between them.
pre-push:
  parallel: true
  jobs:
    # Type-checks against the installed node_modules.
    - name: typecheck
      run: |
        set -eu
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        git archive HEAD | tar -x -C "$tmp"
        ln -s "$PWD/node_modules" "$tmp/node_modules"
        cd "$tmp"
        bun run typecheck

    # Packs the artifact npm would publish, checks the bin keeps its exec bit,
    # installs it into a throwaway global root (never the real one), and runs it.
    # GIT_* come from the hook and would point git calls at this repository, and
    # --ignore-scripts keeps npm pack from running the prepare script.
    - name: pack
      run: |
        set -eu
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        mkdir "$tmp/tree"
        git archive HEAD | tar -x -C "$tmp/tree"
        for v in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$v"; done
        (cd "$tmp/tree" && npm pack --ignore-scripts --silent --pack-destination "$tmp" >/dev/null)
        tgz="$(ls "$tmp"/tokenmaxxing-*.tgz)"
        tar tvf "$tgz" | grep -Eq '^-rwx[-rwx]+ .* package/src/main\.ts$' || { echo "package/src/main.ts is not executable in $tgz"; exit 1; }
        BUN_INSTALL_GLOBAL_DIR="$tmp/global" BUN_INSTALL_BIN="$tmp/bin" bun add -g --silent "$tgz"
        mkdir "$tmp/home"
        HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/home/.config" XDG_STATE_HOME="$tmp/home/.local/state" XDG_DATA_HOME="$tmp/home/.local/share" XDG_CACHE_HOME="$tmp/home/.cache" \
          "$tmp/bin/tokenmaxxing" help >/dev/null
