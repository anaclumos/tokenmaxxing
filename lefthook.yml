# Every check runs here; there is no CI. merge.ts reruns pre-push on the
# head merged onto the live main before it merges.

# A hook that finds no lefthook binary fails the commit or push instead of
# printing "Can't find lefthook in PATH" and passing with no check run.
assert_lefthook_installed: true

pre-commit:
  parallel: true
  jobs:
    # Type-checks the index, the tree the commit holds, against the installed
    # node_modules. lefthook hides only the unstaged hunks of a staged file, so
    # in the working tree an unstaged or untracked file would decide the result.
    - name: typecheck
      glob: ["*.ts", "package.json", "tsconfig.json", "bun.lock"]
      run: |
        set -eu
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        git checkout-index -a --prefix="$tmp/"
        ln -s "$PWD/node_modules" "$tmp/node_modules"
        cd "$tmp"
        bun run typecheck

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: bun run typecheck

    # Packs the artifact npm would publish, checks the bin keeps its exec bit,
    # installs it into a throwaway global root (never the real one), and runs it.
    # GIT_* come from the hook and would point git calls at this repository.
    - name: pack
      run: |
        set -eu
        for v in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$v"; done
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        npm pack --silent --pack-destination "$tmp" >/dev/null
        tgz="$(ls "$tmp"/tokenmaxxing-*.tgz)"
        tar tvf "$tgz" | grep -Eq '^-rwx[-rwx]+ .* package/src/main\.ts$' || { echo "package/src/main.ts is not executable in $tgz"; exit 1; }
        BUN_INSTALL_GLOBAL_DIR="$tmp/global" BUN_INSTALL_BIN="$tmp/bin" bun add -g --silent "$tgz"
        mkdir "$tmp/home"
        HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/home/.config" XDG_STATE_HOME="$tmp/home/.local/state" XDG_DATA_HOME="$tmp/home/.local/share" XDG_CACHE_HOME="$tmp/home/.cache" \
          "$tmp/bin/tokenmaxxing" help >/dev/null
