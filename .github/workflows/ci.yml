# Publish only. Every check runs in lefthook (lefthook.yml); this job exists
# because npm trusted publishing needs a GitHub-hosted runner, and npm binds
# the trusted publisher to this file's name, so it stays ci.yml.
name: CI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # The tag names the version; package.json on main is not bumped by hand
      # or by a bot. A rerun of a tag already on npm skips the publish.
      - name: Take the version from the tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad tag::${GITHUB_REF_NAME} is not v<major>.<minor>.<patch>"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag off main::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main"
            exit 1
          fi
          packument="$(curl -fsS --retry 2 --max-time 60 'https://registry.npmjs.org/tokenmaxxing?write=true')"
          if [ "$(jq --arg v "$version" '.versions | has($v)' <<<"$packument")" = true ]; then
            echo "tokenmaxxing@${version} is already on npm"
            echo "listed=true" >> "$GITHUB_OUTPUT"
          else
            latest="$(jq -r '."dist-tags".latest' <<<"$packument")"
            if [ "$(bun -e "console.log(Bun.semver.order(process.argv[1], process.argv[2]))" "$version" "$latest")" != 1 ]; then
              echo "::error title=Version not newer::${version} is not newer than the latest on npm, ${latest}"
              exit 1
            fi
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
      - if: steps.version.outputs.listed != 'true'
        run: npm publish
      - name: Wait for the registry to list the version
        timeout-minutes: 60
        run: until curl -fsS --retry 2 --max-time 60 'https://registry.npmjs.org/tokenmaxxing?write=true' | jq -e --arg v "${{ steps.version.outputs.version }}" '.versions | has($v)' >/dev/null; do sleep 15; done
