name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Pack and verify the artifact
        run: |
          npm pack
          tar tvf tokenmaxxing-*.tgz > /tmp/tarlist.txt
          grep -E "^-rwx[-rwx]+ .* package/src/main.ts$" /tmp/tarlist.txt
          bun add -g "$PWD"/tokenmaxxing-*.tgz
          tokenmaxxing help

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build flake package
        run: nix build --accept-flake-config .#tokenmaxxing -L
      - name: Smoke-test the store binary
        run: |
          ./result/bin/tokenmaxxing help
          ./result/bin/xx help >/dev/null
          mkdir -p "$RUNNER_TEMP/tm-nix"
          printf '{"thresholds":{"weekly":95}}\n' > "$RUNNER_TEMP/tm-nix/config.json"
          TOKENMAXXING_HOME="$RUNNER_TEMP/tm-nix" ./result/bin/tokenmaxxing config --json | jq -e '.ok == true and .effective.thresholds.weekly == 95 and .effective.thresholds.session == 90' >/dev/null

  publish:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Assign the version
        id: version
        shell: bash
        run: |
          current="$(node -p "require('./package.json').version")"
          versions="$(npm view tokenmaxxing versions --json)"
          if ! jq -e --arg v "$current" '[.. | strings] | index($v) != null' <<<"$versions" >/dev/null; then
            echo "version=${current}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git tag --list 'v*' --contains HEAD)" ]; then
            echo "HEAD is already inside a release"
            exit 0
          fi
          packed="$(npm pack --dry-run --json | jq -er '.. | .files? // empty | .[].path' | cut -d/ -f1 | sort -u)"
          changed="$(git diff --name-only "v${current}" HEAD -- $packed)"
          if [ -z "$changed" ]; then
            echo "no packed file changed since v${current}"
            exit 0
          fi
          echo "$changed"
          next="$(npm version minor --no-git-tag-version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "chore: release ${next#v}" -- package.json
          git push origin HEAD:main
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$(git rev-parse HEAD)" --generate-notes
      - if: steps.version.outputs.version != ''
        run: npm publish
      - name: Wait for the registry to list the version
        if: steps.version.outputs.version != ''
        timeout-minutes: 30
        run: until npm view "tokenmaxxing@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; do sleep 15; done
