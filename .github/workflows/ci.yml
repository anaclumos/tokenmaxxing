name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Artifact-class verification: bun test cannot catch a broken TARBALL
      # (0.2.0 shipped an exec-format-error binary that every test passed
      # around). Assert the committed exec bit on the bun-shebang bin and that
      # the Agent Plugins package lands in the tarball, then install globally
      # and run it, exactly what `bun i -g tokenmaxxing` does on the Linux boxes.
      - name: Pack and verify the artifact
        run: |
          npm pack
          tar tvf tokenmaxxing-*.tgz > /tmp/tarlist.txt
          grep -F "package/agent-plugin/plugin.json" /tmp/tarlist.txt
          grep -E "^-rwx[-rwx]+ .* package/src/main.ts$" /tmp/tarlist.txt
          # absolute path on purpose: bun resolves a RELATIVE tarball path
          # against the global install dir, not cwd (reproduced locally:
          # "ENOENT extracting tarball" - the first CI run of this step).
          bun add -g "$PWD"/tokenmaxxing-*.tgz
          tokenmaxxing help

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build flake package
        run: nix build --accept-flake-config .#tokenmaxxing -L
      - name: Smoke-test the store binary
        run: |
          ./result/bin/tokenmaxxing help
          ./result/bin/xx help >/dev/null
          TOKENMAXXING_HOME="$RUNNER_TEMP/tm-nix" ./result/bin/tokenmaxxing config set thresholds.session 90
          TOKENMAXXING_HOME="$RUNNER_TEMP/tm-nix" ./result/bin/tokenmaxxing config get thresholds.session | grep -qx 90
          TOKENMAXXING_HOME="$RUNNER_TEMP/tm-nix" ./result/bin/tokenmaxxing config unset thresholds.session

  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no token needed
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # ubuntu-latest's default node bundles npm 10.x; trusted publishing needs
      # npm >= 11.5.1, which node 24 ships.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Verify release tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package.json v${version}" >&2
            exit 1
          fi
      - run: npm publish
